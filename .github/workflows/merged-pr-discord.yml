name: Merged PR Discord notifications

on:
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: anyps5-merged-pr-discord
  cancel-in-progress: false

jobs:
  notify:
    if: github.repository == 'DonRyuzaki/anyps5-merge-alerts' && vars.NOTIFIER_ENABLED == 'true' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.repository.default_branch }}
          sparse-checkout: .github/merge-notifier
      - name: Notify only confirmed merged contributions
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 .github/merge-notifier/notify.py
